name: ds-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26.*
  - pandas=2.2.*
  - polars=0.20.*
  - matplotlib=3.8.*
  - seaborn=0.13.*
  - scikit-learn=1.5.*        # >=1.3 needed for root_mean_squared_error
  - statsmodels=0.14.*
  - xgboost=2.0.*
  - ipykernel
  # Optional but handy for notebooks
  - jupyterlab
  - pip
  # If you ever need to add pip-only packages, put them here under pip:
  # - pip:
  #   - some-package==x.y.z
